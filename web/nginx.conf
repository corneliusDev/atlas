# Atlas web: serves the Vite SPA and proxies /api to the api service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads (.md files and .zip archives) go through /api/uploads.
    client_max_body_size 200m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS: resolve "api" per request, so nginx starts even while api is
    # restarting and follows the container if its IP changes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $atlas_api http://api:8000;

    location /api/ {
        # Variable upstream with no URI part: the original request URI is passed unchanged.
        proxy_pass $atlas_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Hashed Vite build assets: cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths render index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
