[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "Atlas: local-first Markdown knowledge graph (api + worker)"
requires-python = ">=3.12"
# Lower bounds chosen so wheels exist for both CPython 3.12 (Docker) and 3.14 (host dev).
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18",
  "psycopg[binary]>=3.2.10,<4",
  "psycopg-pool>=3.2.6,<4",
  "pgvector>=0.3.6",
  "anthropic>=0.75",
  "httpx>=0.28,<1",
  "python-frontmatter>=1.1",
  "markdown-it-py>=3.0",
  "numpy>=2.3.3",
  "scikit-learn>=1.7.2",
  "alembic>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "mypy>=1.13"]

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
"atlas.store" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["db: needs a Postgres (ATLAS_TEST_DATABASE_URL)"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
packages = ["atlas"]

[[tool.mypy.overrides]]
module = ["frontmatter.*", "sklearn.*", "pgvector.*"]
ignore_missing_imports = true
